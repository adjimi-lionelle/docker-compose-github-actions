name: ci
on:
  push:
    branches: [main]

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./site_ibai
          push: true
          tags: |
            ghcr.io/adjimi-lionelle/ibai-backend:${{ github.sha }}
            ghcr.io/adjimi-lionelle/ibai-backend:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./ibai-frontend
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
            VITE_API_BASE_URL_API=${{ vars.VITE_API_BASE_URL_API }}
          tags: |
            ghcr.io/adjimi-lionelle/ibai-frontend:${{ github.sha }}
            ghcr.io/adjimi-lionelle/ibai-frontend:latest

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            cd /opt/ibai
            export TAG=${{ github.sha }}
            docker compose pull
            docker compose up -d
            docker image prune -f